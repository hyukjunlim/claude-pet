<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Claude Pet</title>
  <link rel="stylesheet" href="folder.css">
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search sessions" aria-label="Search sessions" spellcheck="false" autocomplete="off">
    <button id="fold-all" type="button" title="Collapse all folders" aria-label="Collapse all folders">
      <svg class="collapse" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7l4-4 4 4M4 13l4-4 4 4"/></svg>
      <svg class="expand" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3l4 4 4-4M4 9l4 4 4-4"/></svg>
    </button>
  </header>
  <main id="tree" role="tree" aria-label="Sessions by machine and folder"></main>
  <section id="notices" aria-label="eTL" hidden></section>
  <footer id="dock">
    <div id="pet" role="button" aria-label="Claude Pet">
      <div id="sprite" aria-hidden="true"></div>
    </div>
    <div id="meter" role="img" hidden></div>
  </footer>
  <div id="edge" role="separator" aria-orientation="vertical" aria-label="Sidebar width: drag, or double-click for the default" title="Drag to resize · double-click for the default width"></div>
  <div id="zoom-level" aria-live="polite" hidden></div>
  <script src="sprite.js"></script>
  <script src="folder.js"></script>
</body>
</html>
